<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRN - Plataforma de Negociação</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style-melhorias.css">
    <link rel="icon" href="favicon.svg">
    <!-- Ethers.js -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <h1>BRN Token</h1>
            </div>
            <nav>
                <button id="connectWalletBtn" class="btn-primary">Conectar Carteira</button>
                <span id="walletAddress" class="hidden"></span>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Seção de Saldos -->
        <section id="balances-section">
            <h2>Seus Saldos</h2>
            <div id="balances-container" class="balances-grid">
                <div class="loading">Conecte sua carteira para ver os saldos...</div>
            </div>
        </section>

        <!-- Livro de Ofertas -->
        <section id="orderbook-section">
            <h2>Livro de Ofertas</h2>
            <div class="orderbook-grid">
                <!-- Ordens de Compra -->
                <div class="orderbook-column">
                    <h3>Ordens de Compra</h3>
                    <div id="buy-orders-list">
                        <div class="loading">Carregando...</div>
                    </div>
                </div>
                <!-- Ordens de Venda -->
                <div class="orderbook-column">
                    <h3>Ordens de Venda</h3>
                    <div id="sell-orders-list">
                        <div class="loading">Carregando...</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Formulário de Ordem -->
        <section id="trade-section">
            <h2>Realizar Negociação</h2>
            <div class="trade-forms">
                <div class="form-card">
                    <h3>Comprar BRN</h3>
                    <form id="buy-form">
                        <div class="form-group">
                            <label>Preço (USD)</label>
                            <input type="number" id="buy-price" step="0.0001" required>
                        </div>
                        <div class="form-group">
                            <label>Quantidade</label>
                            <input type="number" id="buy-amount" step="1" required>
                        </div>
                        <button type="submit" class="btn-success">Efetuar Compra</button>
                    </form>
                </div>
                <div class="form-card">
                    <h3>Vender BRN</h3>
                    <form id="sell-form">
                        <div class="form-group">
                            <label>Preço (USD)</label>
                            <input type="number" id="sell-price" step="0.0001" required>
                        </div>
                        <div class="form-group">
                            <label>Quantidade</label>
                            <input type="number" id="sell-amount" step="1" required>
                        </div>
                        <button type="submit" class="btn-danger">Efetuar Venda</button>
                    </form>
                </div>
            </div>
        </section>

        <!-- Suas Ordens Abertas -->
        <section id="my-orders-section">
            <h2>Suas Ordens Abertas</h2>
            <div id="my-orders-list">
                <div class="loading">Conecte sua carteira...</div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 BRN Token — Plataforma Descentralizada</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
